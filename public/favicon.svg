<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Guitar Teacher">
  <!--
    An acoustic guitar seen head-on. Drawn from a few large shapes on purpose:
    a favicon is read at 16px, where thin lines and fine detail turn to mush.
  -->
  <rect width="32" height="32" rx="7" fill="#17130F"/>

  <g fill="#FF7A18">
    <!-- Headstock and neck -->
    <rect x="13" y="2.5" width="6" height="3.4" rx="1.2"/>
    <rect x="14.4" y="5" width="3.2" height="11" rx="0.6"/>

    <!-- Body: an upper and a lower bout, the waist implied where they meet -->
    <circle cx="16" cy="18.6" r="5.6"/>
    <circle cx="16" cy="24.4" r="6.6"/>
  </g>

  <!-- Sound hole, cut back to the background so it reads as a hole -->
  <circle cx="16" cy="20.4" r="2.5" fill="#17130F"/>

  <!-- Frets: only three, and only as wide as the neck -->
  <g fill="#17130F">
    <rect x="14.4" y="7.6" width="3.2" height="0.8"/>
    <rect x="14.4" y="10.4" width="3.2" height="0.8"/>
    <rect x="14.4" y="13.2" width="3.2" height="0.8"/>
  </g>

  <!-- Bridge -->
  <rect x="12.8" y="25.4" width="6.4" height="1.6" rx="0.6" fill="#17130F"/>
</svg>
